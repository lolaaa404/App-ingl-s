<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lola, presentación</title>
<!-- Fuentes locales (npm @fontsource): sin red, el render sale igual siempre. -->
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/600-italic.css">

<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--fondo); color: var(--texto); font-family: Inter, sans-serif; }
  * { box-sizing: border-box; }

  /* ---------- fondo del video ---------- */
  #bg { position: absolute; inset: 0; background: #101114; overflow: hidden; }
  #bg i { position: absolute; border-radius: 50%; }
  #bg .b1 { width: 1500px; height: 1500px; background: radial-gradient(closest-side, rgba(79,179,184,.30), rgba(79,179,184,0)); }
  #bg .b2 { width: 1300px; height: 1300px; background: radial-gradient(closest-side, rgba(233,184,114,.17), rgba(233,184,114,0)); }
  #bg .b3 { width: 1100px; height: 1100px; background: radial-gradient(closest-side, rgba(90,110,220,.14), rgba(90,110,220,0)); }

  /* ---------- mundo: ventana de la app + cámara ---------- */
  #mundo { position: absolute; left: 0; top: 0; width: 1560px; height: 900px; transform-origin: 0 0; }
  #ventana { position: absolute; left: 0; top: 0; width: 1560px; height: 900px; border-radius: 14px; overflow: hidden; background: #faf9f6;
             box-shadow: 0 50px 110px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10); }
  #tb { position: absolute; left: 0; top: 0; width: 100%; height: 34px; background: #e9e7e2; border-bottom: 1px solid #d8d4cb; display: flex; align-items: center; }
  #tb .pt { display: flex; gap: 8px; padding-left: 14px; }
  #tb .pt i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  #tb .url { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; color: #5d574e; font-weight: 500; }

  /* ---------- la app (réplica fiel de src/) ---------- */
  #app { --ap-papel: #faf9f6; --ap-hund: #f2f0ec; --ap-borde: #e2ded6; --ap-tinta: #1f1d1a; --ap-suave: #5d574e; --ap-acento: #1c5f63; --ap-acento2: #2b8288;
         position: absolute; left: 0; top: 34px; width: 1560px; height: 866px; background: var(--ap-papel); color: var(--ap-tinta);
         font-family: Inter, sans-serif; font-size: 14px; line-height: 20px; overflow: hidden; font-feature-settings: 'kern','liga'; }
  #app .suave { color: var(--ap-suave); }
  #app .lectura { font-family: 'Source Serif 4', Georgia, serif; }
  #cab { height: 57px; border-bottom: 1px solid var(--ap-borde); background: rgba(250,249,246,.9); display: flex; align-items: center; padding: 0 24px; gap: 24px; }
  #cab .logo b { font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -.025em; }
  #cab .logo span { font-size: 12px; color: var(--ap-suave); margin-left: 8px; }
  #cab nav { display: flex; gap: 4px; }
  #cab nav a { padding: 6px 10px; border-radius: 6px; color: var(--ap-suave); }
  .pagina { position: absolute; left: 0; right: 0; top: 57px; bottom: 0; padding: 24px; }
  .panel { background: #fff; border: 1px solid var(--ap-borde); border-radius: 12px; }
  .panel > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--ap-borde); min-height: 49px; }
  .panel h2 { font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -.025em; margin: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 6px 12px; font-size: 14px; line-height: 20px; font-weight: 500;
         border: 1px solid var(--ap-borde); background: transparent; white-space: nowrap; transform-origin: center; }
  .btn.prin { background: var(--ap-acento); color: #fff; border-color: transparent; }
  .btn.sutil { border-color: transparent; }
  .btn.off { opacity: .6; }
  .sel { display: inline-block; border: 1px solid var(--ap-borde); border-radius: 8px; padding: 8px 32px 8px 12px; background: #fff; font-size: 14px; line-height: 20px; position: relative; white-space: nowrap; }
  .sel::after { content: ''; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid #6b7280; border-bottom: 1.5px solid #6b7280; transform: translateY(-70%) rotate(45deg); }
  .campo { display: block; }
  .campo .et { display: block; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .025em; text-transform: uppercase; margin-bottom: 6px; }
  .campo .ay { display: block; font-size: 12px; line-height: 16px; margin-top: 4px; color: var(--ap-suave); }
  .entrada { border: 1px solid var(--ap-borde); border-radius: 8px; padding: 8px 12px; background: #fff; font-size: 14px; line-height: 20px; min-height: 38px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11px; line-height: 16px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--r, #cbd5e1); white-space: nowrap; }
  .c-amber { background: #fef3c7; color: #78350f; --r: #fcd34d; }
  .c-rose { background: #ffe4e6; color: #881337; --r: #fda4af; }
  .c-fuchsia { background: #fae8ff; color: #701a75; --r: #f0abfc; }
  .c-violet { background: #ede9fe; color: #5b21b6; --r: #c4b5fd; }
  .c-sky { background: #e0f2fe; color: #0c4a6e; --r: #7dd3fc; }
  .c-red { background: #fee2e2; color: #7f1d1d; --r: #f87171; }
  .c-redsev { background: #fee2e2; color: #991b1b; --r: #fca5a5; }
  .c-amsev { background: #fef3c7; color: #92400e; --r: #fcd34d; }
  .c-slate { background: #f1f5f9; color: #334155; --r: #cbd5e1; }
  .c-emerald { background: #d1fae5; color: #065f46; --r: #6ee7b7; }
  .c-yellow { background: #fef9c3; color: #713f12; --r: #fde047; }
  .c-nada { background: transparent; --r: var(--ap-borde); }
  .barra { display: flex; align-items: center; gap: 8px; }
  .barra .pista { height: 6px; flex: 1; border-radius: 999px; background: var(--ap-hund); overflow: hidden; }
  .barra .rell { height: 100%; border-radius: 999px; background: var(--ap-acento); width: 0; }
  .barra .pct { font-size: 12px; line-height: 16px; color: var(--ap-suave); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .aviso { border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 20px; border: 1px solid; }
  .aviso.ok { border-color: #6ee7b7; background: #ecfdf5; color: #064e3b; }
  .cb { display: inline-block; width: 14px; height: 14px; border: 1px solid #8a8780; border-radius: 3px; background: #fff; position: relative; flex: none; margin-top: 3px; }
  .cb.on { background: var(--ap-acento); border-color: var(--ap-acento); }
  .cb.on::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
  .casilla { display: flex; align-items: flex-start; gap: 8px; border-radius: 8px; padding: 6px 8px; }

  /* inicio */
  #p-ini { }
  .grid-ini { display: grid; grid-template-columns: 1fr 420px; gap: 24px; }
  .enc { padding: 12px 16px; border-bottom: 1px solid var(--ap-borde); }
  .enc:last-child { border-bottom: 0; }
  .enc h3 { margin: 0; font-weight: 500; letter-spacing: -.025em; font-size: 16px; line-height: 24px; }
  .enc .meta { font-size: 12px; line-height: 16px; margin-top: 2px; }
  .enc .barra { max-width: 384px; margin-top: 8px; }
  .tabs2 { display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: var(--ap-hund); }
  .tabs2 span { flex: 1; text-align: center; padding: 6px 12px; border-radius: 6px; font-weight: 500; font-size: 14px; }
  .tabs2 span.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tabs2 span:not(.on) { color: var(--ap-suave); }
  #dz { border: 1px dashed var(--ap-borde); border-radius: 8px; padding: 32px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; height: 118px; justify-content: center; position: relative; }
  #dz .t { font-size: 14px; font-weight: 500; }
  #dz .s { font-size: 12px; color: var(--ap-suave); }
  #dz.con { border-color: var(--ap-acento); }

  /* proyecto */
  .barra-enc > .cuerpo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px; }
  .barra-enc h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; }
  .barra-enc .sub { font-size: 12px; line-height: 16px; margin-top: 2px; white-space: nowrap; }
  .barra-enc .acc { display: flex; align-items: center; gap: 8px; }
  #aviso-slot { height: 40px; margin: 12px 0 0; position: relative; }
  #aviso-slot .aviso { position: absolute; left: 0; right: 0; top: 0; }
  .grid-pro { display: grid; grid-template-columns: 1fr 420px; gap: 16px; margin-top: 12px; }
  .filtros { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--ap-borde); }
  .filtro { border-radius: 999px; padding: 4px 10px; font-size: 12px; line-height: 16px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--ap-borde); color: var(--ap-suave); }
  .filtro.on { background: var(--ap-acento); color: #fff; box-shadow: inset 0 0 0 1px var(--ap-acento); }
  #lista { overflow: hidden; position: relative; }
  #lista-in { will-change: transform; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; row-gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--ap-borde); }
  .fila.sel1 { background: rgba(28,95,99,.06); }
  .fila-cab { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
  .fila-cab .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 16px; color: var(--ap-suave); }
  .fila-cab .conf { margin-left: auto; border-radius: 6px; padding: 2px 8px; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--ap-suave); }
  .ser { font-size: 15px; line-height: 24px; }
  .ser.titulo { font-weight: 600; }
  .ser.des { border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; min-height: 40px; position: relative; }
  .ser .sin { font-style: italic; color: var(--ap-suave); position: absolute; left: 8px; top: 6px; }
  .etq-fila { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
  .pw { display: inline; }
  .mk { border-radius: 3px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: rgba(var(--rgb), calc(var(--mk, 0) * var(--al))); box-shadow: 0 0 0 calc(var(--ping, 0) * 7px) rgba(var(--rgb), calc(var(--ping, 0) * .55)); color: color-mix(in srgb, var(--tc) calc(var(--mk, 0) * 100%), var(--ap-tinta)); }
  .mk.on { font-weight: 600; }
  .mk-amber { --rgb: 253,230,138; --al: .85; --tc: #451a03; }
  .mk-rose { --rgb: 254,205,211; --al: .9; --tc: #4c0519; }
  .mk-fuchsia { --rgb: 245,208,254; --al: .9; --tc: #4a044e; }
  .mk-sky { --rgb: 186,230,253; --al: .9; --tc: #082f49; }
  .mk-red { --rgb: 252,165,165; --al: .85; --tc: #450a0a; }
  .col-der { display: flex; flex-direction: column; gap: 16px; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: var(--ap-hund); }
  .tabs span { flex: 1; text-align: center; padding: 6px 8px; border-radius: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ap-suave); }
  .tabs span.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); color: var(--ap-tinta); }
  .pila { display: grid; grid-template-columns: minmax(0, 1fr); }
  .pila > .panel { grid-area: 1 / 1; align-self: start; width: 100%; }
  .cuerpo-lat { overflow: hidden; }
  .sc { padding: 16px; will-change: transform; }
  h3.sec { margin: 0 0 8px; font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; }
  .tarj { border: 1px solid var(--ap-borde); border-radius: 8px; padding: 10px; }
  .tarj + .tarj { margin-top: 10px; }
  .tarj .fr { background: var(--ap-hund); border-radius: 4px; padding: 0 4px; font-weight: 500; }
  .tarj p { margin: 0; }
  .peq { font-size: 13px; line-height: 18px; }
  .nano { font-size: 11px; line-height: 16px; }
  .rev { will-change: opacity, transform; }
  dl.ficha { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; row-gap: 6px; margin: 0; }
  dl.ficha div { display: flex; gap: 8px; }
  dl.ficha dt { font-size: 12px; line-height: 20px; text-transform: uppercase; letter-spacing: .025em; color: var(--ap-suave); flex: none; }
  dl.ficha dd { margin: 0; min-width: 0; }
  ul.l { margin: 0; padding: 0 0 0 18px; }
  .hall { padding: 10px 16px; border-bottom: 1px solid var(--ap-borde); position: relative; }
  .hall.on { background: rgba(28,95,99,.09); box-shadow: inset 3px 0 0 var(--ap-acento); }
  #menu-exp { position: absolute; background: #fff; border: 1px solid var(--ap-borde); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 4px; min-width: 230px; z-index: 5; }
  #menu-exp div { padding: 6px 10px; border-radius: 5px; font-size: 14px; line-height: 20px; }
  #menu-exp div.h { background: rgba(28,95,99,.12); color: var(--ap-acento); font-weight: 500; }

  /* ---------- cursor, archivo, clic ---------- */
  #cursor { position: absolute; left: 0; top: 0; width: 28px; height: 28px; z-index: 50; pointer-events: none; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  #ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid #4fb3b8; z-index: 49; }
  #archivo { position: absolute; z-index: 48; width: 250px; height: 62px; margin: -12px 0 0 -14px; background: #fff; border: 1px solid #d9d4c9; border-radius: 10px;
             box-shadow: 0 14px 30px rgba(0,0,0,.28); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; line-height: 18px; font-weight: 500; color: #1f1d1a; }
  #archivo .ic, .ic-pdf { width: 30px; height: 36px; border-radius: 4px; background: #e5484d; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; flex: none; }

  /* ---------- capas de video (pantalla) ---------- */
  .pill { position: absolute; background: rgba(16,17,20,.88); color: var(--texto); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.07); }
  #kicker { left: 56px; top: 36px; padding: 12px 24px 12px 14px; font-size: 28px; line-height: 34px; font-weight: 600; display: flex; align-items: center; gap: 14px; visibility: hidden; letter-spacing: -.01em; }
  #kicker b { background: var(--acento); color: #0b1f20; border-radius: 10px; padding: 0 12px; font-size: 24px; line-height: 38px; font-weight: 700; }
  #sub { left: 50%; bottom: 40px; transform: translateX(-50%); padding: 14px 34px 16px; font-size: 46px; line-height: 56px; font-weight: 600; text-align: center; white-space: nowrap; letter-spacing: -.01em; visibility: hidden; }
  #sub b { color: var(--acento); font-weight: 700; }
  .callout { position: absolute; background: #fff; color: #1f1d1a; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.45); visibility: hidden; }
  #pills { position: absolute; left: 96px; top: 126px; display: flex; gap: 14px; visibility: hidden; }
  #pills span { display: block; padding: 14px 26px; border-radius: 999px; font-size: 30px; line-height: 36px; font-weight: 600; color: #cfd3d6; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); }
  #pills span.on { background: var(--acento); color: #0b1f20; box-shadow: none; }
  #scan { left: 96px; top: 250px; width: 640px; height: 560px; padding: 26px 30px; }
  #scan .cab { display: flex; align-items: center; justify-content: space-between; font-size: 20px; font-weight: 600; margin-bottom: 18px; color: #5d574e; }
  #scan .ln { height: 12px; border-radius: 6px; background: #e7e3da; margin: 14px 0; }
  #scan .cor { font-family: 'Source Serif 4', serif; font-size: 22px; line-height: 32px; color: #1f1d1a; margin: 6px 0; }
  #scan .br { display: inline-block; font-family: Inter, sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; border-radius: 8px; padding: 6px 14px; margin: 8px 0; background: #f1f5f9; color: #475569; }
  #scan .br.on { background: #fae8ff; color: #701a75; box-shadow: 0 0 0 3px #f0abfc; }
  #doc { left: 70px; top: 470px; width: 500px; height: 470px; padding: 30px 34px; }
  #doc .wb { position: absolute; right: 22px; top: 20px; width: 56px; height: 56px; border-radius: 12px; background: #2b6bd6; color: #fff; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  #doc .tt { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 26px; letter-spacing: .02em; margin: 6px 80px 16px 0; line-height: 32px; }
  #doc .ln { height: 11px; border-radius: 6px; background: #e3dfd6; margin: 12px 0; }
  #doc .tb2 { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 2px solid #d8d3c8; border-radius: 6px; margin: 18px 0; }
  #doc .tb2 i { height: 38px; border-right: 2px solid #d8d3c8; border-bottom: 2px solid #d8d3c8; display: block; }
  #doc .tb2 i:nth-child(3n) { border-right: 0; } #doc .tb2 i:nth-last-child(-n+3) { border-bottom: 0; }
  #doc .pie { position: absolute; left: 34px; right: 34px; bottom: 24px; font-size: 22px; line-height: 28px; font-weight: 600; color: #1c5f63; }

  #hook { position: absolute; left: 0; right: 0; top: 78px; text-align: center; padding: 0 140px; font-family: Fraunces, serif; font-weight: 700; font-size: 100px; line-height: 106px; letter-spacing: -.02em; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  #hook .l2 { display: block; font-style: italic; font-weight: 600; margin-top: 10px; color: var(--acento); }
  #hook .tach { text-decoration: line-through; text-decoration-thickness: 5px; text-decoration-color: rgba(255,255,255,.0); }

  #cierre { position: absolute; inset: 0; visibility: hidden; background: rgba(12,13,16,.0); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #cierre .marca { font-family: Fraunces, serif; font-weight: 700; font-size: 230px; line-height: 220px; letter-spacing: -.03em; }
  #cierre .marca em { color: var(--acento); font-style: normal; }
  #cierre .baj { font-size: 34px; line-height: 44px; font-weight: 500; color: #b8bec2; letter-spacing: .04em; margin-top: 8px; }
  #cierre .f1, #cierre .f2 { font-family: Fraunces, serif; font-weight: 600; font-size: 92px; line-height: 104px; letter-spacing: -.02em; }
  #cierre .f1 { margin-top: 56px; }
  #cierre .f2 b { color: var(--acento); font-style: italic; font-weight: 600; }
  #cierre .nota { position: absolute; right: 56px; bottom: 44px; font-size: 22px; color: #8c9296; }
  #dim { position: absolute; inset: 0; visibility: hidden; background: linear-gradient(90deg, rgba(14,15,18,.93) 0, rgba(14,15,18,.86) 44%, rgba(14,15,18,.0) 62%); }
  #fin { position: absolute; inset: 0; background: #101114; opacity: 0; }
</style>
</head>
<body>
<div id="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="mundo">
  <div id="ventana">
    <div id="tb"><div class="pt"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="url">Lola · asistente de traducción</div></div>
    <div id="app"></div>
  </div>
  <div id="archivo"><span class="ic">PDF</span><span>contrato-distribucion-acme.pdf</span></div>
  <div id="menu-exp"></div>
  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 28 28"><path d="M4 2 L4 22 L9.2 17.2 L12.6 25 L16 23.6 L12.7 15.9 L19.8 15.6 Z" fill="#111" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
</div>

<div id="dim"></div>
<section id="hook"><span class="l1"></span><span class="l2"></span></section>
<div id="pills"></div>
<div id="scan" class="callout"></div>
<div id="doc" class="callout"></div>
<div id="kicker" class="pill"></div>
<section id="cierre"><div class="marca"></div><div class="baj"></div><div class="f1"></div><div class="f2"></div><div class="nota"></div></section>

// texto con marcas: cada palabra va en su span (para que aparezca palabra por palabra) y las marcas envuelven sus palabras
function marcado(texto, marks) {
  const pos = [];
  marks.forEach((m, i) => { const ix = texto.indexOf(m.f); if (ix > -1) pos.push({ a: ix, b: ix + m.f.length, i }); });
  pos.sort((x, y) => x.a - y.a);
  const palabras = (s) => s.split(/(\s+)/).map(w => (/^\s+$/.test(w) || !w) ? w : `<span class="pw">${esc(w)}</span>`).join("");
  let h = "", c = 0;
  for (const p of pos) {
    h += palabras(texto.slice(c, p.a));
    h += `<mark class="mk mk-${ETQ[marks[p.i].e].mk}" data-m="${p.i}" style="--fw:${marks[p.i].e === "posible-calco" || true ? 600 : 400}">${palabras(texto.slice(p.a, p.b))}</mark>`;
    c = p.b;
  }
  return h + palabras(texto.slice(c));
}
function filaHTML(f) {

/* =============== cámara, cursor, utilidades =============== */
function camara(t) {
  let i = 0;
  while (i < camKeys.length - 2 && t >= camKeys[i + 1][0]) i++;
  const a = camKeys[i], b = camKeys[i + 1] || a;
  const p = b[0] > a[0] ? ease.inOut(clamp((t - a[0]) / (b[0] - a[0]))) : 1;
  return [lerp(a[1], b[1], p), lerp(a[2], b[2], p), lerp(a[3], b[3], p)];
}
function cursorPos(t) {
  let i = 0;
  while (i < curKeys.length - 2 && t >= curKeys[i + 1][0]) i++;
  const a = curKeys[i], b = curKeys[i + 1] || a;
  const p = b[0] > a[0] ? ease.inOut(clamp((t - a[0]) / (b[0] - a[0]))) : 1;
  return [lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
}
const set = (sel, txt) => { const e = typeof sel === "string" ? $(sel) : sel; if (e.textContent !== txt) e.textContent = txt; };

  for (const r of revs) {

}

  const pt = k(t, TM.trad0, TM.trad0 + 3.7, ease.lin);
  const hechos = Math.round(pt * NFILAS);
  const traduciendo = t >= TM.clicTraducir + 0.1 && pt < 1;
  const traducido = pt >= 1;
  const confirmados = t >= TM.clicGuardar - 1 ? 9 : t >= TM.clicConf + 0.1 ? 3 : 0;
  set("#sub-enc", `Inglés → Español · ${NFILAS} segmentos · ${hechos} traducidos · ${confirmados} confirmados · contrato-distribucion-acme.pdf`);
  const pr = traduciendo || traducido ? pt : 0;
  css($("#prog"), { width: `${pr * 100}%` });
  set("#prog-p", `${Math.round(pr * 100)} %`);
  set("#b-analizar span", t < TM.clicAnalizar + 0.05 ? "Analizar fuente" : t < TM.analizado ? "Analizando…" : "Releer fuente");
  set("#b-traducir span", traduciendo ? "Traduciendo…" : traducido ? "Traducir 0 pendientes" : "Traducir 12 pendientes");
  $("#b-traducir").classList.toggle("off", traduciendo || traducido);
  const enQA = t >= TM.clicQA && t < TM.informe;
  set("#b-qa span", enQA ? "Revisando…" : "Control de calidad");
  $("#b-memoria").classList.toggle("off", confirmados === 0 || false);
  // filtros
  set("#f-pend", `Pendientes (${NFILAS - hechos})`);
  set("#f-marc", `Marcados (${t > E.dif + 0.2 ? 4 : 0})`);
  set("#f-conf", `Confirmados (${confirmados})`);

  // aviso (debajo de la barra)
  let av = null;
  if (t >= TM.analizado && t < TM.analizado + 2.6) av = ["Texto analizado.", k(t, TM.analizado, TM.analizado + 0.3) * (1 - k(t, TM.analizado + 2.3, TM.analizado + 2.6))];
  else if (traducido && t < TM.trad0 + 3.7 + 3.4) av = ["Traducción terminada.", k(t, TM.trad0 + 3.7, TM.trad0 + 4.0) * (1 - k(t, TM.trad0 + 6.8, TM.trad0 + 7.1))];
  else if (t >= TM.clicGuardar + 0.3 && t < TM.clicGuardar + 3.8) av = ["9 segmentos confirmados guardados en la memoria de traducción.", k(t, TM.clicGuardar + 0.3, TM.clicGuardar + 0.6) * (1 - k(t, TM.clicGuardar + 3.4, TM.clicGuardar + 3.8))];
  if (av) { set("#aviso", av[0]); css($("#aviso"), { opacity: av[1], transform: `translateY(${(1 - av[1]) * -6}px)` }); } else css($("#aviso"), { opacity: 0 });

  // ----- filas del banco
  const t0f = [TM.trad0, TM.trad0, TM.trad0 + 0.7, TM.trad0 + 1.55, TM.trad0 + 2.4, TM.trad0 + 3.0, TM.trad0 + 3.35]; // inicio de cada fila
  FILAS.forEach((f, i) => {
    const fila = filas[i];
    const ini = t0f[i], dur = f.mem ? 0.3 : 0.95;
    const p = k(t, ini, ini + dur, ease.lin);
    const palabras = $$(".des .pw", fila);
    const n = palabras.length;
    palabras.forEach((w, j) => { const q = clamp(p * n - j); w.style.opacity = q; });
    css($(".sin", fila), { opacity: p > 0 ? 0 : 1 });
    const hecho = p >= 1, enCurso = p > 0 && p < 1;
    const conf = (i === 2 && t >= TM.clicConf + 0.08) || (i <= 1 && t >= TM.clicGuardar - 1);
    const est = $(".est", fila);
    const nombreEst = conf ? "Confirmado" : hecho ? "Traducido" : enCurso ? "Traducido" : "Pendiente";
    set(est, nombreEst);
    est.className = "chip est " + (conf ? "c-emerald" : nombreEst === "Traducido" ? "c-sky" : "c-slate");
    css($(".mem", fila), { display: f.mem && p > 0 ? "" : "none" });
    css($(".conf", fila), { visibility: hecho && !conf ? "visible" : "hidden" });
    fila.classList.toggle("sel1", i === 0 ? t < TM.clicEtq : i === 2 && t >= TM.clicEtq);
  });
  // marcas: se resuelve por (fila, ámbito, índice dentro del ámbito)
  FILAS.forEach((f, i) => {
    const fila = filas[i];
    for (const a of ["o", "d"]) {
      const lista = f.marks.filter(m => m.a === a);
      $$(".mk", $(a === "o" ? ".ori" : ".des", fila)).forEach(m => {
        const info = lista[+m.dataset.m];
        if (!info) return;
        const q = k(t, info.t, info.t + 0.4, ease.out);
        const ping = k(t, info.t, info.t + 0.9, ease.out);
        m.style.setProperty("--mk", q); m.classList.toggle("on", q > 0);
        m.style.setProperty("--ping", q > 0 ? Math.max(0, 1 - ping) * Math.sin(Math.PI * Math.min(1, ping * 1.6)) : 0);
        // la omisión sólo existe una vez que el control de calidad la detecta
      });
    }
  });
  // la lista del banco se desplaza para seguir el trabajo
  const sc1 = lerp(0, SB, k(t, TM.trad0 + 1.0, TM.trad0 + 2.3, ease.inOut)) + lerp(0, SB2 - SB, k(t, TM.clicHallazgo + 0.3, TM.clicHallazgo + 1.4, ease.inOut));
  css($("#lista"), { height: "515px" });
  css($("#lista-in"), { transform: `translateY(${-sc1}px)` });

  // ----- pestañas
  let tab = "fuente";
  if (t >= TM.clicRecursos) tab = "recursos";
  if (t >= TM.clicEtq) tab = "detalle";
  if (t >= TM.clicQA) tab = "calidad";
  $$("#tabs span").forEach(s => s.classList.toggle("on", s.dataset.p === tab));
  ["fuente", "detalle", "calidad", "recursos"].forEach(n => { const el = $("#pn-" + n); el.style.visibility = n === tab ? "visible" : "hidden"; el.style.opacity = n === tab ? 1 : 0; });
  revelar(t);

  // panel Fuente
  const analizado = t >= TM.analizado - 0.1;
  css($("#fu-vacio"), { display: analizado ? "none" : "" });
  css($("#fu-lleno"), { visibility: analizado ? "visible" : "hidden" });
  const scF = lerp(0, 250, k(t, E.registro + 0.9, E.terminos + 0.9, ease.inOut));
  css($("#sc-fuente"), { transform: `translateY(${-scF}px)` });
  // panel Detalle: desplazamiento por secciones
  const scD = lerp(0, 235, k(t, E.justif - 0.2, E.justif + 0.7, ease.inOut)) + lerp(0, 150, k(t, E.fuentes + 0.1, E.alt + 0.4, ease.inOut));
  css($("#sc-detalle"), { transform: `translateY(${-scD}px)` });
  // panel Calidad
  const informe = t >= TM.informe;
  set("#qa-vt", enQA ? "Revisando…" : "Sin control ejecutado");
  css($("#qa-vacio"), { display: informe ? "none" : "" });
  css($("#qa-lleno"), { visibility: informe ? "visible" : "hidden" });
  $("#b-qa2").classList.toggle("off", enQA);
  const hs = $$("#qa-lista .hall");
  hs.forEach((h, i) => { const q = k(t, TM.informe + 0.1 + i * 0.09, TM.informe + 0.4 + i * 0.09); h.style.opacity = q; });
  const foco = (a, b) => t >= a && t < b;
  const activos = {
    num: foco(E.cifras - 0.1, E.fechas - 0.15), fec: foco(E.fechas - 0.1, E.glosario - 0.15), glo: foco(E.glosario - 0.1, E.segunda - 0.2),
    omi: t >= E.segunda + 0.2 && t < E.omisiones + 0.2 || t >= E.omisiones + 0.2, sen: foco(E.segunda + 0.2, E.omisiones + 0.2),
  };
  hs.forEach(h => h.classList.toggle("on", !!activos[h.dataset.k]));
  const qk = [[E.cifras - 0.5, 0], [E.cifras + 0.1, QOFF[2]], [E.fechas - 0.1, QOFF[2]], [E.fechas + 0.4, QOFF[3]], [E.glosario - 0.1, QOFF[3]], [E.glosario + 0.4, QOFF[4]], [E.segunda - 0.15, QOFF[4]], [E.segunda + 0.55, 0]];
  let sq = 0; for (let i = 0; i < qk.length - 1; i++) if (t >= qk[i][0]) sq = lerp(qk[i][1], qk[i + 1][1], ease.inOut(clamp((t - qk[i][0]) / (qk[i + 1][0] - qk[i][0]))));
  css($("#qa-lista"), { transform: `translateY(${-sq}px)` });
  // checkboxes de recursos
  $("#cb-glo2").classList.toggle("on", t >= E.glosarios + 0.1);
  $("#cb-dic1").classList.toggle("on", t >= E.glosarios + 0.6);

  // menú de exportación
  const mAb = t >= TM.clicExp + 0.05 && t < TM.clicDocx + 0.15;
  css($("#menu-exp"), { visibility: mAb ? "visible" : "hidden", opacity: k(t, TM.clicExp + 0.05, TM.clicExp + 0.25) });
  $$("#menu-exp div").forEach((d, i) => d.classList.toggle("h", i === 0 && t >= TM.clicDocx - 0.45));

  // ================= cursor y clics =================
  const [cxu, cyu] = cursorPos(t);
  const visC = t >= curKeys[0][0] && t < S(8) ? 1 : 0;
  const hold = arrastrando;
  css($("#cursor"), { transform: `translate(${cxu - 4}px, ${cyu - 3}px)`, opacity: visC * k(t, S(1) + 0.2, S(1) + 0.5) * (1 - k(t, S(8) - 0.5, S(8))) , visibility: visC ? "visible" : "hidden" });
  clics.forEach(c => { const p = clamp(1 - Math.abs(t - c.t) / 0.16); c.el.style.transform = p > 0 ? `scale(${1 - 0.05 * p})` : ""; c.el.style.filter = p > 0 ? `brightness(${1 - 0.1 * p})` : ""; });
  const rc = clics.filter(c => t >= c.t && t < c.t + 0.6).pop();
  if (rc) { const [rx, ry] = cursorPos(rc.t); const q = (t - rc.t) / 0.6; css($("#ripple"), { visibility: "visible", transform: `translate(${rx}px, ${ry}px) scale(${0.4 + q * 1.5})`, opacity: (1 - q) * 0.9 }); }
  else css($("#ripple"), { visibility: "hidden" });

  // ================= capas de video =================
  // hook
  const h2 = k(t, E.mesa - 0.15, E.mesa + 0.45, ease.back);
  const hOut = k(t, E.mesa + 1.7, E.mesa + 2.5, ease.in);
  css($("#hook"), { opacity: 1 - hOut, transform: `translateY(${-hOut * 40}px)`, visibility: hOut >= 1 ? "hidden" : "visible" });
  css($("#hook .l1"), { opacity: lerp(1, 0.38, ease.out(k(t, E.mesa - 0.2, E.mesa + 0.4))) });
    css($("#hook .l2"), { opacity: h2, transform: `translateY(${(1 - h2) * 40}px) scale(${lerp(0.94, 1, h2)})`, visibility: h2 > 0 ? "visible" : "hidden" });

  // kicker por escena
  let ki = 0; for (let i = 1; i <= 7; i++) if (t >= S(i) + 0.15 && t < F(i) - 0.1) ki = i;
  const kk = ki ? KICK[ki] : null;
  if (kk) { const h = `<b>${kk[0]}</b>${kk[1]}`; if (kickLast !== h) { $("#kicker").innerHTML = h; kickLast = h; } }
  const kIn = ki ? k(t, S(ki) + 0.15, S(ki) + 0.6, ease.out) * (1 - k(t, F(ki) - 0.35, F(ki) - 0.1, ease.in)) : 0;
  css($("#kicker"), { visibility: kIn > 0.01 ? "visible" : "hidden", opacity: kIn, transform: `translateX(${(1 - kIn) * -30}px)` });

  // escena 1: formatos y escaneo
  const e1 = k(t, S(1) + 0.3, S(1) + 0.8) * (1 - k(t, TM.clicCrear - 0.3, TM.clicCrear + 0.1));
  css($("#pills"), { visibility: e1 > 0.01 ? "visible" : "hidden", opacity: e1, transform: `translateY(${(1 - e1) * -16}px)` });
  const on = [E.pdf - 0.05, E.word - 0.05, E.word + 0.45, E.escaneo - 0.05];
  $$("#pills span").forEach((p, i) => p.classList.toggle("on", t >= on[i]));
  css($("#dim"), { visibility: e1 > 0.01 ? "visible" : "hidden", opacity: e1 });
  const sc = k(t, E.lee - 0.35, E.lee + 0.25, ease.back) * (1 - k(t, TM.clicCrear - 0.3, TM.clicCrear + 0.1));
  css($("#scan"), { visibility: sc > 0.01 ? "visible" : "hidden", opacity: Math.min(1, sc * 1.5), transform: `translateY(${(1 - sc) * 40}px) scale(${lerp(0.94, 1, sc)})` });
  $("#br-sello").classList.toggle("on", t >= E.sellos - 0.05);
  $("#br-firma").classList.toggle("on", t >= E.firmas - 0.05);
  // escena 7: documento Word
  const dc = k(t, TM.clicDocx + 0.1, TM.clicDocx + 0.7, ease.back) * (1 - k(t, F(7) - 0.5, F(7) - 0.1));
  css($("#doc"), { visibility: dc > 0.01 ? "visible" : "hidden", opacity: Math.min(1, dc * 1.4), transform: `translate(${(1 - dc) * -60}px, 0) rotate(${(1 - dc) * -4 - 1.5}deg) scale(${lerp(0.9, 1, dc)})` });

  // cierre
  const ci = k(t, S(8) + 0.1, S(8) + 0.9);
  css($("#cierre"), { visibility: ci > 0 ? "visible" : "hidden", background: `rgba(12,13,16,${0.45 * ci})` });
  const q = (a, b) => k(t, a, b, ease.back);
  css($("#cierre .marca"), { opacity: q(E.lola - 0.15, E.lola + 0.5), transform: `translateY(${(1 - q(E.lola - 0.15, E.lola + 0.5)) * 40}px)` });
  css($("#cierre .baj"), { opacity: k(t, E.lola + 0.25, E.lola + 0.9) });
  css($("#cierre .f1"), { opacity: q(E.motor - 0.1, E.motor + 0.55), transform: `translateY(${(1 - q(E.motor - 0.1, E.motor + 0.55)) * 36}px)` });
  css($("#cierre .f2"), { opacity: q(E.vos - 0.1, E.vos + 0.55), transform: `translateY(${(1 - q(E.vos - 0.1, E.vos + 0.55)) * 36}px)` });
  css($("#cierre .nota"), { opacity: k(t, E.vos + 0.3, E.vos + 0.9) * 0.9 });

  // subtítulos (palabra resaltada)
  const r = V.palabras.length ? subtitulo($("#sub"), t, { maxCar: 44, maxPal: 8 }) : null;
  css($("#sub"), { visibility: r && $("#sub").innerHTML ? "visible" : "hidden" });
  // fundido final
  css($("#fin"), { opacity: k(t, D - 0.5, D, ease.in) });
};
</script>
</body>
</html>
